name: Deploy Documentation

# Disabled: the docs site is not published yet. To re-enable, restore the
# original trigger block below AND enable GitHub Pages in repo settings
# (Settings -> Pages -> Source: GitHub Actions), then re-run this workflow.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Set to true to run (Pages must be enabled in repo settings)'
        type: boolean
        required: false
        default: false

jobs:
  guard:
    if: ${{ github.event.inputs.confirm != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deployment disabled
        run: |
          echo "This workflow is intentionally disabled."
          echo "Enable GitHub Pages (Settings -> Pages -> Source: GitHub Actions)"
          echo "and run this workflow with confirm=true to publish the docs site."
          exit 0

