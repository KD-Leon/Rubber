<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="Rubber Duck mascot">
  <!-- Static export of the chubby yellow mascot duck (createDuckSvg in
       src/ui/AgentSidebarView.ts) for README / docs branding. -->
  <!-- Cute soft double baby feather tuft on top -->
  <path d="M36.5 15 C34.5 9 39.5 6 42 9.5 C44 6 49 7 48 12 C47.5 14 45 15.5 43 15.5 Z"
        fill="#FFB800" stroke="#E29B00" stroke-width="1" stroke-linejoin="round"/>
  <!-- Chubby mochi head -->
  <path d="M40 14 C56 14 67 25 69 41 C71 56 65 70 52 73 C46 74 34 74 28 73 C15 70 9 56 11 41 C13 25 24 14 40 14 Z"
        fill="#FFD428" stroke="#EE9E00" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- Soft pastel cheek blushes -->
  <ellipse cx="19" cy="49" rx="5.2" ry="3.2" fill="#FF829C" opacity="0.55"/>
  <ellipse cx="61" cy="49" rx="5.2" ry="3.2" fill="#FF829C" opacity="0.55"/>
  <!-- Wide-set innocent dark eyes -->
  <ellipse cx="29" cy="43.5" rx="3.2" ry="4.2" fill="#1C1C1E"/>
  <ellipse cx="51" cy="43.5" rx="3.2" ry="4.2" fill="#1C1C1E"/>
  <!-- Catchlight sparkles -->
  <circle cx="28" cy="42" r="1.3" fill="#FFFFFF"/>
  <circle cx="50" cy="42" r="1.3" fill="#FFFFFF"/>
  <!-- Chubby rounded horizontal duck beak -->
  <ellipse cx="40" cy="51" rx="10.5" ry="6.2" fill="#FF7018" stroke="#E85B00" stroke-width="1.2"/>
  <!-- Soft beak highlight -->
  <ellipse cx="40" cy="49.5" rx="7.5" ry="3" fill="#FFA33A"/>
</svg>
